# ═══════════════════════════════════════════════════════════════════════
# BEFORE — Task 5: Single Unscaled Service (The Problem)
# ═══════════════════════════════════════════════════════════════════════
#
# Bad docker-compose (single instance, no LB):
#
#  services:
#    app:
#      build: .
#      ports:
#        - "8000:8000"       # ⚠ Direct exposure, no Nginx
#      # ⚠ Only ONE container — no redundancy
#      # ⚠ No Redis — queue runs sync (QUEUE_CONNECTION=sync)
#      # ⚠ No load balancer — single point of failure
#
# ═══════════════════════════════════════════════════════════════════════
# AFTER (current code): 3 app instances + Nginx + Redis + Prometheus + Grafana
# ═══════════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-api:latest
    container_name: ecommerce-app-1
    hostname: app1
    environment: &app_env
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY:-base64:U2FtcGxlS2V5Rm9yRGV2ZWxvcG1lbnQ=}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/app/database/database.sqlite
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      LOG_CHANNEL: stack
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
    volumes: &app_volumes
      - ./:/var/www/app
      - sqlite_data:/var/www/app/database
      - storage_data:/var/www/app/storage
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-api:latest
    container_name: ecommerce-app-2
    hostname: app2
    environment: *app_env
    volumes: *app_volumes
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
  app3:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-api:latest
    container_name: ecommerce-app-3
    hostname: app3
    environment: *app_env
    volumes: *app_volumes
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    restart: unless-stopped
  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce-nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/app/public:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ecommerce-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--log.level=info'
      - '--enable-feature=remote-write-receiver'
    depends_on:
      - app1
      - app2
      - app3
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  grafana:
    image: grafana/grafana:10.4.0
    container_name: ecommerce-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/ecommerce-dashboard.json
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  redis_data:
  sqlite_data:
  storage_data:
  prometheus_data:
  grafana_data:
