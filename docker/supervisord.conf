[supervisord]
nodaemon=false
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:laravel-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/app/artisan queue:work redis --queue=default,invoices,notifications,analytics --sleep=3 --tries=3 --max-jobs=500
numprocs=5
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/queue-worker.log
stopwaitsecs=10

[program:laravel-worker-heavy]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/app/artisan queue:work redis --queue=heavy --sleep=3 --tries=3
numprocs=2
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/queue-heavy.log
stopwaitsecs=10

[program:laravel-worker-batch]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/app/artisan queue:work redis --queue=batch-processing --sleep=3 --tries=3 --timeout=300
numprocs=3
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/queue-batch.log
stopwaitsecs=10

# ── Async Log Worker (Task 8 — Async Step Logging) ──────────
# Processes AsyncLogJob dispatches from the 'logs' queue.
# These jobs write step-level timing logs to storage/logs/checkout/*.log
# WITHOUT blocking the main HTTP request/transaction.
#
# Only 1 process needed — log writes are fast (~3ms each) and one
# worker can handle thousands per second. More processes would just
# compete for disk I/O on the same log files.
[program:laravel-worker-logs]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/app/artisan queue:work redis --queue=logs --sleep=1 --tries=1 --max-jobs=200
numprocs=1
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/worker-logs.log
stopwaitsecs=5
