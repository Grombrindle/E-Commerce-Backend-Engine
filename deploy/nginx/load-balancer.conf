# ═══════════════════════════════════════════════════════════════════════
# ╔══════════════════════════════════════════════════════════════════════╗
# ║  BEFORE — Task 5: Single Server (The Problem)                      ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
# Originally there was ONE Laravel instance handling ALL requests.
# This was a single point of failure and a performance bottleneck.
# No load balancing, no fault tolerance, no horizontal scaling.
#
#          Bad config (single server, no load balancing):
#
#          server {
#              listen 80;
#              server_name api.example.com;
#
#              # ⚠ Single backend — if it goes down, site is down
#              location / {
#                  proxy_pass http://localhost:8000;
#              }
#          }
#
#          Bad docker-compose (single app instance):
#
#          services:
#            app:
#              build: .                     # ⚠ Only ONE instance
#              ports:
#                - "8000:8000"              # ⚠ No Nginx front-end
#              # ⚠ No load balancer, no Redis, no horizontal scaling
#
# What went wrong:
#  - Single point of failure → if the server dies, everything dies
#  - No horizontal scaling → max throughput = 1 server's capacity
#  - No load distribution → one server bears ALL traffic
#  - No health checks → failed server still receives requests
#
# ╔══════════════════════════════════════════════════════════════════════╗
# ║  AFTER — Task 5: Weighted Load Balancing with Nginx (Fix)          ║
# ╚══════════════════════════════════════════════════════════════════════╝
#
#          ✅ upstream with weighted round-robin (3:2:1)
#          ✅ 3 app instances running behind Nginx
#          ✅ Health checks (max_fails=3, fail_timeout=30s)
#          ✅ X-Upstream header for monitoring
#          ✅ Nginx-level rate limiting (60 req/s)
#          ✅ Fault tolerance — Nginx routes around failed instances
#
# To test the bad code:
#   1. Use docker-compose with single app instance (no nginx)
#   2. Stop the app container → site goes down
#   3. Restore load-balanced setup → site survives instance failure
# ═══════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────
# Nginx Load Balancer — E-Commerce API (Docker Setup)
# ────────────────────────────────────────────────────────
#
# This config is mounted into the Nginx container in docker-compose.yml.
# It reverse-proxies to the Laravel app containers running on port 8000.
#
# Load-balancing strategies available:
#   - Round-Robin (default): even distribution
#   - least_conn: least active connections
#   - ip_hash: session stickiness by client IP
#
# Since Docker DNS resolves `app` to all container IPs round-robin,
# each `server app:8000` entry will independently resolve to potentially
# different containers. The weights control traffic proportion:
#   server_1 weight=3 → 50% of traffic
#   server_2 weight=2 → 33%
#   server_3 weight=1 → 17%

upstream laravel_backend {
    # ── Strategy ──────────────────────────────────────────
    # Uncomment one: least_conn;  or  ip_hash;
    # Default (commented) = round-robin

    # ── Weighted Upstream Servers ────────────────────────
    # ── Individual App Instance Hostnames ─────────────
    # Each Docker container has an explicit hostname (app1, app2, app3).
    # This ensures deterministic weighted distribution — Nginx resolves
    # each hostname independently to the correct container IP.
    server app1:8000 weight=3 max_fails=3 fail_timeout=30s;
    server app2:8000 weight=2 max_fails=3 fail_timeout=30s;
    server app3:8000 weight=1 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

# ── Rate Limiting (must be at http level, not inside server block) ─────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ── Logging ───────────────────────────────────────────
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # ── Security Headers ──────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Upstream $upstream_addr always;
    add_header X-Upstream-Status $upstream_status always;

    # ── Proxy to Laravel Backend ──────────────────────────
    location / {
        proxy_pass http://laravel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;

        # Nginx-level rate limiting (60 req/s, burst 20)
        limit_req zone=api_limit burst=20 nodelay;
    }

    # ── Deny Sensitive Files ──────────────────────────────
    location ~ /\.(?!well-known) { deny all; }
    location ~ (\.env|\.git|composer\.|artisan) { deny all; return 404; }
}
