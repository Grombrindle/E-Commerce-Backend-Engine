# ═══════════════════════════════════════════════════════════════════════
# BEFORE — Task 5: Single Server (The Problem)
# ═══════════════════════════════════════════════════════════════════════
#
# Bad config (single server, no load balancing):
#
#  server {
#      listen 80;
#      server_name api.example.com;
#      location / {
#          proxy_pass http://localhost:8000;  # ⚠ Single backend
#      }
#  }
#
# ═══════════════════════════════════════════════════════════════════════
# AFTER (current code): Weighted round-robin (3:2:1) + FastCGI + rate limiting
# ═══════════════════════════════════════════════════════════════════════

upstream laravel_backend {
    server app1:9000 weight=3 max_fails=3 fail_timeout=30s;
    server app2:9000 weight=2 max_fails=3 fail_timeout=30s;
    server app3:9000 weight=1 max_fails=3 fail_timeout=30s;
}
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /dev/stdout;
    error_log  /dev/stderr;
    root /var/www/app/public;
    index index.php;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Upstream $upstream_addr always;
    add_header X-Upstream-Status $upstream_status always;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        limit_req zone=api_limit burst=20 nodelay;
    }
    location ~ \.php$ {
        fastcgi_pass laravel_backend;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param APP_ENV production;
        fastcgi_connect_timeout 60s;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 60s;
        fastcgi_buffers 8 8k;
        fastcgi_buffer_size 8k;
        fastcgi_busy_buffers_size 16k;
    }
    location ~ /\.(?!well-known) { deny all; }
    location ~ (\.env|\.git|composer\.|artisan) { deny all; return 404; }
}
